  # ---- SmartRecruiters ---------------------------------------------------
  # OFF BY DEFAULT. SmartRecruiters documents this as a public, unauthenticated
  # Posting API — but api.smartrecruiters.com serves a blanket-disallow
  # robots.txt (even /robots.txt itself is disallowed to crawlers). The API
  # will very likely answer, but fetching it contradicts the host's own stated
  # crawl policy, so it is your call, not a default. It is 3% of the Canadian
  # market; these two employers are also covered by the Simplify sweep.
  # Uncomment only if you have decided that is fine.
