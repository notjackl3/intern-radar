# Tier 0 — poll the ATS at the origin, before anything indexes it.
#
# Every tenant/site/token below was extracted from the apply URLs of the 449
# live Canadian listings on 12 Sep 2026, so they are real, not guessed.
#
# Adding a Workday employer: open their careers page and read the URL —
#   https://rbc.wd3.myworkdayjobs.com/en-US/RBCEARLYTALENT1/job/...
#          ^tenant ^shard              ^locale(drop) ^site
# Adding Greenhouse/Lever/Ashby/SmartRecruiters: the token is the first path
# segment of any job URL on that board.
#
# tier: fast   -> polled every 20 min. Default for Greenhouse/Lever/Ashby,
#                 where one GET returns the whole board. Set it explicitly on
#                 a Workday site you want watched closely despite the paging.
# tier: full   -> polled every 2 hours. Default for Workday/SmartRecruiters.

companies:

  # ---- Workday: ~60% of the Canadian intern market -----------------------
  # RBC runs a DEDICATED early-talent site. It is the single highest-value
  # endpoint in this file — 72 live Canadian intern roles across both sites.
  - name: Royal Bank of Canada (Early Talent)
    ats: workday
    tenant: rbc
    shard: wd3
    site: RBCEARLYTALENT1
    tier: fast          # highest-value endpoint in this file — watch it closely

